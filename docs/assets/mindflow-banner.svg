<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-label="MindFlow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1F2A"/>
      <stop offset="45%" stop-color="#143A4A"/>
      <stop offset="100%" stop-color="#1F5C4A"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F7F5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#D7E7DF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7CDBB2"/>
      <stop offset="100%" stop-color="#E6C07B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grain" width="120" height="120" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="18" r="1.2" fill="#ffffff" opacity="0.05"/>
      <circle cx="64" cy="42" r="1" fill="#ffffff" opacity="0.04"/>
      <circle cx="98" cy="86" r="1.4" fill="#ffffff" opacity="0.035"/>
      <circle cx="40" cy="96" r="0.9" fill="#ffffff" opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1280" height="480" fill="url(#sky)"/>
  <rect width="1280" height="480" fill="url(#grain)"/>

  <!-- flowing paths -->
  <g opacity="0.55" filter="url(#soft)">
    <path d="M-40 340 C 180 220, 320 420, 520 280 S 860 120, 980 240 S 1200 380, 1320 260"
          fill="none" stroke="url(#accent)" stroke-width="18" stroke-linecap="round"/>
    <path d="M-20 390 C 220 270, 360 450, 560 320 S 900 150, 1020 270 S 1220 410, 1340 300"
          fill="none" stroke="#7CDBB2" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- mark -->
  <g transform="translate(96,118)">
    <circle cx="54" cy="54" r="54" fill="#0E2A33" stroke="#7CDBB2" stroke-width="3"/>
    <path d="M28 70 C 40 30, 52 30, 54 54 C 56 78, 68 78, 80 38"
          fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="28" cy="70" r="5" fill="#E6C07B"/>
    <circle cx="80" cy="38" r="5" fill="#7CDBB2"/>
  </g>

  <text x="240" y="190" fill="url(#ink)" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif" font-size="92" font-weight="700" letter-spacing="-1.5">MindFlow</text>
  <text x="244" y="250" fill="#C9D9D1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" letter-spacing="0.5">A personal knowledge workspace that thinks with you</text>
  <text x="244" y="310" fill="#8FB5A5" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Notion-like pages · Obsidian-like links · local AI agent</text>
</svg>
